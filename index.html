<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestione Certificati Medici</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'donbosco-blue': '#0033A0',
                        'donbosco-yellow': '#FFD100',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide scrollbar for clean UI but keep functionality */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <div id="app" class="flex-grow flex flex-col h-full overflow-hidden"></div>

    <footer class="bg-gray-100 text-center py-2 text-xs text-gray-400 border-t border-gray-200 shrink-0">
        sviluppato da Lollino HSL
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'gestione-certificati-donbosco';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let app, db, auth;
        if (Object.keys(firebaseConfig).length > 0) {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        }

        const state = {
            isAuthenticated: false,
            role: null, // 'user' (donbosco) o 'admin'
            filter: 'all',
            athletes: [],
            athleteToDelete: null,
            unsubscribe: null
        };

        function loadDataFromCloud() {
            if (!auth || !auth.currentUser) return;
            const athletesRef = collection(db, 'artifacts', appId, 'public', 'data', 'athletes');
            
            state.unsubscribe = onSnapshot(athletesRef, (snapshot) => {
                state.athletes = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                render();
            }, (error) => {
                console.error("Errore Firestore:", error);
            });
        }

        function getCertificateStatus(expiryDateStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const expDate = new Date(expiryDateStr);
            const diffTime = expDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return { code: 'expired', label: 'Scaduto', days: diffDays, colorClass: 'bg-red-100 text-red-800 border-red-300', icon: 'fa-times-circle text-red-500' };
            } else if (diffDays <= 14) {
                return { code: 'urgent', label: 'Scade tra ' + diffDays + ' gg', days: diffDays, colorClass: 'bg-orange-100 text-orange-800 border-orange-300', icon: 'fa-exclamation-triangle text-orange-500' };
            } else if (diffDays <= 30) {
                return { code: 'warning', label: 'Scade tra ' + diffDays + ' gg', days: diffDays, colorClass: 'bg-yellow-100 text-yellow-800 border-yellow-300', icon: 'fa-exclamation-circle text-yellow-500' };
            } else {
                return { code: 'valid', label: 'Valido (' + diffDays + ' gg)', days: diffDays, colorClass: 'bg-green-100 text-green-800 border-green-300', icon: 'fa-check-circle text-green-500' };
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/D';
            const parts = dateString.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateString;
        }

        function render() {
            const appDiv = document.getElementById('app');
            if (!state.isAuthenticated) {
                appDiv.innerHTML = renderLogin();
            } else {
                appDiv.innerHTML = renderDashboard();
            }
        }

        function renderLogin() {
            return `
                <div class="flex-grow flex items-center justify-center bg-donbosco-blue p-4 fade-in">
                    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md text-center">
                        <div class="w-20 h-20 bg-donbosco-yellow rounded-full mx-auto flex items-center justify-center mb-6 shadow-lg">
                            <i class="fa-solid fa-file-medical text-donbosco-blue text-4xl"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-donbosco-blue mb-2">Gestione Certificati</h1>
                        <p class="text-gray-500 mb-8 text-sm">Inserisci la password di accesso.</p>
                        
                        <form id="loginForm" class="space-y-4" onsubmit="window.login(event)">
                            <div>
                                <input type="password" id="passwordInput" placeholder="Password" 
                                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-donbosco-yellow focus:border-transparent transition text-center text-lg" required>
                                <p id="loginError" class="text-red-500 text-sm mt-2 hidden">Password errata. Riprova.</p>
                            </div>
                            <button type="submit" class="w-full bg-donbosco-yellow text-donbosco-blue font-bold py-3 px-4 rounded-xl shadow-md hover:bg-yellow-400 transition transform hover:-translate-y-0.5">
                                Accedi <i class="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            let stats = { total: 0, warning: 0, urgent: 0, expired: 0 };
            
            // Ordina per data di scadenza (i più vicini alla scadenza prima)
            const sortedAthletes = [...state.athletes].sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));
            
            // Costruzione lista atleti
            const athletesHTML = sortedAthletes.map(athlete => {
                const status = getCertificateStatus(athlete.expiryDate);
                
                // Statistiche
                stats.total++;
                if (status.code === 'warning') stats.warning++;
                if (status.code === 'urgent') stats.urgent++;
                if (status.code === 'expired') stats.expired++;

                // Filtro
                if (state.filter !== 'all' && status.code !== state.filter) {
                    if (state.filter === 'warning' && status.code === 'urgent') {
                        // Mostra le urgenze anche nel filtro warning
                    } else {
                        return '';
                    }
                }

                // Genera pulsante WhatsApp (Visibile per Admin se c'è un numero)
                let waButton = '';
                if (state.role === 'admin' && athlete.phone) {
                    waButton = `<button onclick="window.sendWhatsApp('${athlete.phone}', '${athlete.name.replace(/'/g, "\\'")}', ${status.days}, '${status.code}')" class="w-8 h-8 rounded-full bg-green-50 text-green-500 hover:bg-green-500 hover:text-white transition flex items-center justify-center shrink-0 shadow-sm border border-green-200" title="Invia messaggio WhatsApp">
                        <i class="fa-brands fa-whatsapp text-lg"></i>
                    </button>`;
                }

                // Scheda Atleta
                return `
                    <div class="bg-white rounded-xl shadow-sm border-l-4 ${status.colorClass.split(' ')[2]} p-4 flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between hover:shadow-md transition">
                        <div class="flex-grow w-full sm:w-auto overflow-hidden">
                            <div class="flex items-center gap-2 mb-1 flex-wrap">
                                <h3 class="font-bold text-gray-800 text-lg leading-tight truncate">${athlete.name}</h3>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide whitespace-nowrap ${status.colorClass}">
                                    <i class="fa-solid ${status.icon} mr-1"></i> ${status.label}
                                </span>
                            </div>
                            <div class="text-xs text-gray-500 grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-1 mt-2">
                                <div><i class="fa-solid fa-cake-candles w-4 text-center"></i> Nato: <b class="text-gray-700">${formatDate(athlete.dob)}</b></div>
                                <div class="truncate"><i class="fa-solid fa-user-shield w-4 text-center"></i> Genitore: <b class="text-gray-700">${athlete.parentName || '-'}</b></div>
                                <div><i class="fa-solid fa-calendar-check w-4 text-center text-blue-400"></i> Emesso: <b class="text-gray-700">${formatDate(athlete.issueDate)}</b></div>
                                <div><i class="fa-solid fa-calendar-xmark w-4 text-center text-red-400"></i> Scade: <b class="text-gray-700">${formatDate(athlete.expiryDate)}</b></div>
                                <div><i class="fa-solid fa-phone w-4 text-center"></i> Tel: <b class="text-gray-700">${athlete.phone || '-'}</b></div>
                                <div class="truncate" title="${athlete.privacyFileName || 'N/D'}"><i class="fa-solid fa-file-pdf w-4 text-center text-red-500"></i> Privacy: <b class="text-gray-700">${athlete.privacyFileName || 'N/D'}</b></div>
                            </div>
                        </div>
                        <div class="flex flex-row sm:flex-col justify-end gap-2 w-full sm:w-auto mt-2 sm:mt-0 pt-3 sm:pt-0 border-t sm:border-t-0 border-gray-100">
                            ${waButton}
                            <button onclick="window.promptDelete('${athlete.id}')" class="w-8 h-8 rounded-full bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition flex items-center justify-center shrink-0 shadow-sm border border-red-200" title="Elimina atleta">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Layout Principale Dashboard
            return `
                <header class="bg-donbosco-blue text-white shadow-lg shrink-0">
                    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-notes-medical text-donbosco-yellow text-2xl"></i>
                            <div>
                                <h1 class="text-lg sm:text-xl font-bold leading-tight truncate max-w-[200px] sm:max-w-md">Gestione Certificati</h1>
                                <span class="text-xs text-blue-200 font-medium">
                                    ${state.role === 'admin' ? '<i class="fa-solid fa-shield-halved mr-1"></i> Accesso Admin' : '<i class="fa-solid fa-user mr-1"></i> Accesso Operatore'}
                                </span>
                            </div>
                        </div>
                        <button onclick="window.logout()" class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition shrink-0">
                            <i class="fa-solid fa-sign-out-alt"></i> <span class="hidden sm:inline ml-1">Esci</span>
                        </button>
                    </div>
                </header>

                <main class="flex-grow overflow-y-auto bg-gray-50 p-4">
                    <div class="max-w-5xl mx-auto space-y-6">
                        
                        <!-- Barra Statistiche / Filtri -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div onclick="window.setFilter('all')" class="cursor-pointer bg-white rounded-xl p-3 shadow-sm border-b-4 ${state.filter === 'all' ? 'border-blue-500' : 'border-transparent'} hover:bg-gray-50 transition text-center">
                                <div class="text-2xl font-bold text-gray-700">${stats.total}</div>
                                <div class="text-[10px] sm:text-xs text-gray-500 uppercase tracking-wide">Totali</div>
                            </div>
                            <div onclick="window.setFilter('warning')" class="cursor-pointer bg-white rounded-xl p-3 shadow-sm border-b-4 ${state.filter === 'warning' ? 'border-yellow-400' : 'border-transparent'} hover:bg-gray-50 transition text-center">
                                <div class="text-2xl font-bold text-yellow-600">${stats.warning}</div>
                                <div class="text-[10px] sm:text-xs text-gray-500 uppercase tracking-wide">< 1 Mese</div>
                            </div>
                            <div onclick="window.setFilter('urgent')" class="cursor-pointer bg-white rounded-xl p-3 shadow-sm border-b-4 ${state.filter === 'urgent' ? 'border-orange-500' : 'border-transparent'} hover:bg-gray-50 transition text-center">
                                <div class="text-2xl font-bold text-orange-600">${stats.urgent}</div>
                                <div class="text-[10px] sm:text-xs text-gray-500 uppercase tracking-wide">< 2 Settimane</div>
                            </div>
                            <div onclick="window.setFilter('expired')" class="cursor-pointer bg-white rounded-xl p-3 shadow-sm border-b-4 ${state.filter === 'expired' ? 'border-red-500' : 'border-transparent'} hover:bg-gray-50 transition text-center">
                                <div class="text-2xl font-bold text-red-600">${stats.expired}</div>
                                <div class="text-[10px] sm:text-xs text-gray-500 uppercase tracking-wide">Scaduti</div>
                            </div>
                        </div>

                        <!-- Intestazione Lista -->
                        <div class="flex justify-between items-center">
                            <h2 class="text-lg font-bold text-gray-700">Elenco Atleti</h2>
                            <button onclick="window.showModal(document.getElementById('addModal'))" class="bg-donbosco-yellow text-donbosco-blue font-bold py-2 px-4 rounded-lg shadow hover:bg-yellow-400 transition flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Nuovo Certificato</span>
                            </button>
                        </div>

                        <!-- Lista Atleti -->
                        <div class="space-y-3 pb-10">
                            ${athletesHTML || '<div class="text-center py-12 text-gray-400 bg-white rounded-xl border border-dashed border-gray-300"><i class="fa-solid fa-box-open text-4xl mb-3 text-gray-300"></i><p>Nessun certificato in questa lista.</p></div>'}
                        </div>
                    </div>
                </main>

                <div id="modalOverlay" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm transition-opacity" onclick="if(event.target === this) { window.hideModal(document.getElementById('addModal')); window.hideModal(document.getElementById('deleteModal')); }">
                    
                    <!-- Modale Aggiungi -->
                    <div id="addModal" class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full max-w-lg hidden transform transition-all translate-y-full sm:translate-y-0 sm:scale-95 opacity-0 flex flex-col max-h-[95vh] sm:max-h-[90vh]" onclick="event.stopPropagation()">
                        <div class="p-4 sm:p-6 overflow-y-auto flex-grow rounded-t-2xl sm:rounded-2xl">
                            
                            <div class="flex justify-between items-center mb-5 shrink-0 sticky top-0 bg-white z-10 pb-2 border-b border-gray-100">
                                <h3 class="text-xl font-bold text-donbosco-blue">Nuovo Certificato</h3>
                                <button onclick="window.hideModal(document.getElementById('addModal'))" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 transition"><i class="fa-solid fa-times"></i></button>
                            </div>
                            
                            <form id="addAthleteForm" class="space-y-4" onsubmit="window.submitAddAthlete(event)">
                                <!-- Info Base -->
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nome e Cognome Atleta *</label>
                                    <input type="text" id="athleteName" required class="w-full px-4 py-2 bg-gray-50 rounded-lg border border-gray-300 focus:bg-white focus:ring-2 focus:ring-donbosco-blue focus:border-transparent outline-none transition">
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Data di Nascita *</label>
                                        <input type="date" id="athleteDob" required class="w-full px-4 py-2 bg-gray-50 rounded-lg border border-gray-300 focus:bg-white focus:ring-2 focus:ring-donbosco-blue focus:border-transparent outline-none transition">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1">Cellulare (Avvisi) *</label>
                                        <input type="tel" id="athletePhone" required placeholder="Es: 3331234567" class="w-full px-4 py-2 bg-gray-50 rounded-lg border border-gray-300 focus:bg-white focus:ring-2 focus:ring-donbosco-blue focus:border-transparent outline-none transition">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nome Genitore <span class="text-gray-400 font-normal">(se minorenne)</span></label>
                                    <input type="text" id="parentName" placeholder="Es: Mario Rossi" class="w-full px-4 py-2 bg-gray-50 rounded-lg border border-gray-300 focus:bg-white focus:ring-2 focus:ring-donbosco-blue focus:border-transparent outline-none transition">
                                </div>

                                <!-- Date Certificato -->
                                <div class="grid grid-cols-2 gap-4 pt-2">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1 text-blue-600">Data Emissione *</label>
                                        <input type="date" id="issueDate" required class="w-full px-4 py-2 bg-blue-50 rounded-lg border border-blue-200 focus:bg-white focus:ring-2 focus:ring-donbosco-blue focus:border-transparent outline-none transition">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-700 mb-1 text-red-600">Data Scadenza *</label>
                                        <input type="date" id="athleteDate" required class="w-full px-4 py-2 bg-red-50 rounded-lg border border-red-200 focus:bg-white focus:ring-2 focus:ring-red-400 focus:border-transparent outline-none transition">
                                    </div>
                                </div>
                                
                                <!-- Sezione Privacy e Responsabilità -->
                                <div class="space-y-4 mt-6 bg-yellow-50/50 p-4 rounded-xl border border-yellow-200">
                                    <h4 class="font-bold text-sm text-gray-800 border-b border-yellow-200 pb-2"><i class="fa-solid fa-shield-halved text-donbosco-yellow mr-1"></i> Privacy e Documentazione</h4>
                                    
                                    <div class="flex flex-col gap-2">
                                        <span class="text-xs text-gray-600 font-medium">1. Scarica e fai firmare il modello:</span>
                                        <a href="https://www.borgodonbosco.com/uploads/1789735400_Modello_privacy.pdf" target="_blank" class="inline-flex items-center justify-center gap-2 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 py-2 px-3 rounded-lg text-sm font-bold transition w-full sm:w-fit shadow-sm">
                                            <i class="fa-solid fa-file-pdf text-red-500"></i> Modello Privacy (PDF)
                                        </a>
                                    </div>
                                    
                                    <div>
                                        <label class="block text-xs text-gray-600 font-medium mb-1">2. Allega il modulo compilato *</label>
                                        <input type="file" id="privacyFile" accept=".pdf,image/*" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-donbosco-blue file:text-white hover:file:bg-blue-700 transition cursor-pointer">
                                    </div>
                                    
                                    <div class="space-y-2 pt-2 border-t border-yellow-200">
                                        <label class="flex items-start gap-3 cursor-pointer">
                                            <input type="checkbox" id="privacyFlag" required class="mt-0.5 min-w-[1rem] h-4 w-4 text-donbosco-blue rounded border-gray-300 focus:ring-donbosco-blue">
                                            <span class="text-xs text-gray-700 leading-tight">Dichiaro di aver allegato il modello privacy scaricato dal sito compilato e firmato *</span>
                                        </label>
                                        <label class="flex items-start gap-3 cursor-pointer">
                                            <input type="checkbox" id="responsibilityFlag" required class="mt-0.5 min-w-[1rem] h-4 w-4 text-donbosco-blue rounded border-gray-300 focus:ring-donbosco-blue">
                                            <span class="text-xs text-gray-700 leading-tight">Dichiaro sotto la mia responsabilità la veridicità dei dati forniti e, in caso di minore, di averne la responsabilità genitoriale *</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="pt-4 pb-2 sm:pb-0 sticky bottom-0 bg-white border-t sm:border-0 border-gray-100 mt-4">
                                    <button type="submit" class="w-full bg-donbosco-blue text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-blue-800 active:scale-95 transition transform">
                                        Salva Certificato
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Modale Elimina -->
                    <div id="deleteModal" class="bg-white rounded-2xl shadow-2xl w-full max-w-sm hidden transform transition-all scale-95 opacity-0 p-6 text-center" onclick="event.stopPropagation()">
                        <div class="w-16 h-16 bg-red-100 rounded-full mx-auto flex items-center justify-center mb-4 text-red-500 text-2xl">
                            <i class="fa-solid fa-trash-can"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">Elimina Certificato</h3>
                        <p class="text-sm text-gray-500 mb-6">Sei sicuro di voler eliminare definitivamente i dati di questo atleta?</p>
                        <div class="flex gap-3 justify-center">
                            <button onclick="window.hideModal(document.getElementById('deleteModal'))" class="px-5 py-2.5 rounded-xl border border-gray-300 text-gray-600 hover:bg-gray-50 font-bold transition w-full">Annulla</button>
                            <button onclick="window.confirmDelete()" class="px-5 py-2.5 rounded-xl bg-red-500 text-white hover:bg-red-600 font-bold transition shadow-md w-full">Elimina</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.login = async function(e) {
            e.preventDefault();
            const pwd = document.getElementById('passwordInput').value;
            
            let role = null;
            if (pwd === 'admin') role = 'admin';
            else if (pwd === 'donbosco') role = 'user';

            if (role) {
                if (auth) {
                    try {
                        if (typeof __initial_auth_token !== 'undefined') {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                        state.isAuthenticated = true;
                        state.role = role;
                        loadDataFromCloud();
                        render();
                    } catch(err) {
                        console.error("Auth error", err);
                        document.getElementById('loginError').classList.remove('hidden');
                    }
                } else {
                    // Fallback Locale
                    state.isAuthenticated = true;
                    state.role = role;
                    render();
                }
            } else {
                document.getElementById('loginError').classList.remove('hidden');
                document.getElementById('passwordInput').classList.add('border-red-500', 'bg-red-50');
            }
        };

        window.logout = function() {
            state.isAuthenticated = false;
            state.role = null;
            if (state.unsubscribe) state.unsubscribe();
            render();
        };

        window.setFilter = function(filterValue) {
            state.filter = filterValue;
            render();
        };

        window.promptDelete = function(id) {
            state.athleteToDelete = id;
            window.showModal(document.getElementById('deleteModal'));
        };

        window.showModal = function(modalElement) {
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.remove('hidden');
            modalElement.classList.remove('hidden');
            // Timeout to allow CSS transition to trigger
            setTimeout(() => {
                modalElement.classList.remove('scale-95', 'translate-y-full', 'opacity-0');
            }, 10);
        };

        window.hideModal = function(modalElement) {
            const overlay = document.getElementById('modalOverlay');
            modalElement.classList.add('scale-95', 'translate-y-full', 'opacity-0');
            setTimeout(() => {
                modalElement.classList.add('hidden');
                if (document.getElementById('addModal').classList.contains('hidden') && 
                    document.getElementById('deleteModal').classList.contains('hidden')) {
                    overlay.classList.add('hidden');
                }
            }, 200); // Matches CSS transition duration
        };

        window.submitAddAthlete = async function(e) {
            e.preventDefault();
            const name = document.getElementById('athleteName').value;
            const dob = document.getElementById('athleteDob').value;
            const parentName = document.getElementById('parentName').value;
            const issueDate = document.getElementById('issueDate').value;
            const date = document.getElementById('athleteDate').value;
            const phone = document.getElementById('athletePhone').value;
            const privacy = document.getElementById('privacyFlag').checked;
            const responsibility = document.getElementById('responsibilityFlag').checked;
            
            const privacyFileInput = document.getElementById('privacyFile');
            const privacyFileName = privacyFileInput && privacyFileInput.files.length > 0 ? privacyFileInput.files[0].name : '';
            
            if (name && date && dob && issueDate && privacy && responsibility) {
                const athleteData = {
                    name: name,
                    dob: dob,
                    parentName: parentName || '',
                    issueDate: issueDate,
                    expiryDate: date,
                    phone: phone || '',
                    privacyAccepted: privacy,
                    responsibilityAccepted: responsibility,
                    privacyFileName: privacyFileName,
                    createdAt: new Date().toISOString()
                };

                if (db && auth && auth.currentUser) {
                    try {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'athletes'), athleteData);
                        window.hideModal(document.getElementById('addModal'));
                    } catch (err) {
                        console.error("Errore salvataggio in Cloud:", err);
                    }
                } else {
                    state.athletes.push({ id: Date.now().toString(), ...athleteData });
                    window.hideModal(document.getElementById('addModal'));
                    render();
                }
            }
        };

        window.confirmDelete = async function() {
            if (state.athleteToDelete) {
                if (db && auth && auth.currentUser) {
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'athletes', state.athleteToDelete));
                        state.athleteToDelete = null;
                        window.hideModal(document.getElementById('deleteModal'));
                    } catch (err) {
                        console.error("Errore eliminazione:", err);
                    }
                } else {
                    state.athletes = state.athletes.filter(a => a.id !== state.athleteToDelete);
                    state.athleteToDelete = null;
                    window.hideModal(document.getElementById('deleteModal'));
                    render();
                }
            }
        };

        window.sendWhatsApp = function(phone, name, days, statusCode) {
            if (!phone) return;
            
            let message = "";
            if (statusCode === 'expired') {
                message = `Ciao ${name}, ti avvisiamo che il tuo certificato medico sportivo risulta SCADUTO. Fino al rinnovo non potrai partecipare agli allenamenti. Contattaci appena prenoti la nuova visita!`;
            } else if (statusCode === 'urgent') {
                message = `Ciao ${name}, ATTENZIONE: il tuo certificato medico scade tra soli ${days} giorni! Ti ricordiamo di rinnovarlo al più presto per continuare gli allenamenti.`;
            } else if (statusCode === 'warning') {
                message = `Ciao ${name}, ti informiamo che il tuo certificato medico sportivo scadrà tra circa un mese (${days} giorni). Ti invitiamo a prenotare la visita per il rinnovo.`;
            } else {
                message = `Ciao ${name}, ti contattiamo dalla segreteria sportiva del Borgo Don Bosco per una comunicazione veloce.`;
            }
            
            // Pulizia del numero 
            let cleanPhone = phone.replace(/[^0-9+]/g, '');
            if (!cleanPhone.startsWith('+39') && !cleanPhone.startsWith('39') && cleanPhone.length >= 9) {
                cleanPhone = '39' + cleanPhone; // Meglio usare 39 senza il + per i link wa.me
            } else {
                cleanPhone = cleanPhone.replace('+', ''); 
            }

            const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank'); 
        };

        // Primo avvio
        render();
    </script>
</body>
</html>
